<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Slide2Pdf</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  </head>
  <body>
    <main>
      <header>
        <img src="assets/icon-80.png" width="44" height="44" alt="" />
        <div>
          <h1>Slide2Pdf</h1>
          <p>将当前幻灯片导出为矢量 PDF</p>
        </div>
      </header>

      <p id="loading">正在连接 PowerPoint…</p>

      <section id="app" hidden>
        <button id="export-slide" data-export type="button">
          <span>导出整页</span>
          <small>保留幻灯片原始尺寸</small>
        </button>

        <button id="export-content" data-export class="primary" type="button">
          <span>按内容裁切</span>
          <small>只保留当前页可见对象的范围</small>
        </button>

        <label class="option" for="transparent-background">
          <input id="transparent-background" type="checkbox" />
          <span>
            <strong>透明背景</strong>
            <small>将整页纯白背景改为透明</small>
          </span>
        </label>

        <p id="save-hint" class="hint"></p>
      </section>

      <p id="status" role="status" aria-live="polite" data-state="idle" hidden></p>
    </main>
  </body>
</html>
