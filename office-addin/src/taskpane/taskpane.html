<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Slide2Pdf</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  </head>
  <body>
    <main>
      <header>
        <img src="assets/icon-80.png" width="44" height="44" alt="" />
        <div>
          <h1>Slide2Pdf</h1>
          <p>把当前幻灯片保存为矢量 PDF</p>
        </div>
      </header>

      <p id="loading">正在连接 PowerPoint…</p>

      <section id="app" hidden>
        <button id="export-slide" data-export type="button">
          <span>导出当前页</span>
          <small>保留完整幻灯片尺寸</small>
        </button>

        <button id="export-content" data-export class="primary" type="button">
          <span>导出并裁切内容</span>
          <small>裁到当前页所有可见对象的边界</small>
        </button>

        <label class="option" for="transparent-background">
          <input id="transparent-background" type="checkbox" />
          <span>
            <strong>透明背景</strong>
            <small>移除 PowerPoint 生成的整页纯白背景</small>
          </span>
        </label>

        <p id="save-hint" class="hint"></p>
      </section>

      <p id="status" role="status" aria-live="polite" data-state="idle">
        就绪
      </p>

      <footer>
        本地流程：PowerPoint 生成整份 PDF → 抽取当前页 → 可选透明背景与裁切
      </footer>
    </main>
  </body>
</html>
